[project]
name = "internal-kb-qa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "google-genai>=3.0.0",
    "numpy>=2.4.6",
    "openai>=3.46.0",
    "pypdf>=7.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
extend-exclude = ["common"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
